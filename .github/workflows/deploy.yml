name: Deploy to Firebase

# Merging to main = live. Builds, tests, then deploys the whole TeamHub app
# (rules, indexes, Storage rules, website, then Cloud Functions) to the
# brophy-soccer-app Firebase project. Needs ONE repo secret,
# FIREBASE_SERVICE_ACCOUNT (a Google service-account JSON key — see
# docs/AUTO_DEPLOY.md). Without it the workflow stops with a clear message.

on:
  push:
    branches: [main]
    paths: ['teamhub/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test + deploy
    runs-on: ubuntu-latest
    env:
      REQUIRE_VAPID: '1'
    defaults:
      run:
        working-directory: teamhub
    steps:
      - name: Check the deploy secret is set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        working-directory: .
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Repo secret FIREBASE_SERVICE_ACCOUNT is not set — see docs/AUTO_DEPLOY.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            teamhub/package-lock.json
            teamhub/functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: teamhub/functions
      - run: npm run lint
      - run: npm test
      - run: npm test
        working-directory: teamhub/functions
      - name: Build (fails if the push-notification key is missing)
        run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # The website and rules go first, so a Cloud Functions problem (e.g. a
      # missing IAM role) can never keep app changes off the live site.
      - name: Deploy rules, indexes and website
        run: >
          npx -y firebase-tools@14 deploy
          --only firestore:rules,firestore:indexes,storage,hosting
          --project brophy-soccer-app --force --non-interactive
      - name: Live
        run: |
          echo "Live: https://brophy-soccer-app.web.app" >> "$GITHUB_STEP_SUMMARY"
          curl -s "https://brophy-soccer-app.web.app/version.json?ts=$(date +%s)" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Deploy Cloud Functions
        run: >
          npx -y firebase-tools@14 deploy
          --only functions
          --project brophy-soccer-app --force --non-interactive
