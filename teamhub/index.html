<html lang="en" style="background:#980000">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#980000" />

    <meta name="apple-mobile-web-app-title" content="Brophy Soccer" />
    <title>Brophy Soccer</title>
    <!--
      Loading screen. Plain HTML/CSS (no app code), so it paints the instant
      the page arrives — even right after an update, while the new app
      downloads (that used to be a blank white screen). The app calls
      window.__hideSplash() once it's ready (see TeamHubRoles + main.jsx).
    -->
    <style>
      #splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(120% 80% at 50% 0%,#b30000 0%,#980000 45%,#5a0000 100%);color:#fff;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .45s ease,visibility .45s;
        padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
      #splash.out{opacity:0;visibility:hidden}
      #splash::before{content:"";position:absolute;inset:0;opacity:.08;pointer-events:none;
        background:repeating-linear-gradient(115deg,#fff 0 2px,transparent 2px 22px)}
      #splash .logo{width:min(64vw,300px);height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));animation:sp-in .6s ease-out both}
      #splash .track{position:relative;width:min(78vw,300px);margin-top:54px}
      #splash .ball{position:absolute;top:-33px;left:0;width:34px;height:34px;margin-left:-17px;transition:left .5s ease;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
      #splash .ball svg{width:100%;height:100%;animation:sp-roll .7s linear infinite;animation-play-state:running}
      #splash .ball .hop{width:100%;height:100%;animation:sp-hop .7s cubic-bezier(.45,0,.55,1) infinite}
      #splash .head{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px}
      #splash .label{font-size:12px;font-weight:900;letter-spacing:.32em;opacity:.9}
      #splash .pct{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;opacity:.9}
      #splash .bar{position:relative;height:20px;border:2.5px solid #fff;border-radius:6px;padding:2px;background:rgba(0,0,0,.25);box-shadow:0 4px 14px rgba(0,0,0,.3)}
      #splash .fill{height:100%;width:6%;border-radius:2px;transition:width .5s ease;background:repeating-linear-gradient(-45deg,#fff 0 10px,#ffd0d0 10px 20px);background-size:28px 28px;animation:sp-stripes .6s linear infinite}
      #splash .tip{position:absolute;left:24px;right:24px;bottom:calc(36px + env(safe-area-inset-bottom));text-align:center;font-size:13px;line-height:1.45;opacity:.85;min-height:38px;transition:opacity .35s}
      #splash .tip b{font-weight:900;letter-spacing:.12em;font-size:11px;display:block;opacity:.75;margin-bottom:2px}
      #splash .slow{display:none;margin-top:18px;font-size:13px;opacity:.9;text-align:center}
      #splash .slow button{margin-top:10px;background:#fff;color:#980000;border:0;border-radius:99px;padding:10px 22px;font-weight:800;font-size:14px}
      @keyframes sp-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
      @keyframes sp-roll{to{transform:rotate(360deg)}}
      @keyframes sp-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes sp-stripes{to{background-position:28px 0}}
      @keyframes sp-spin{to{transform:rotate(360deg)}}

      @media (prefers-reduced-motion:reduce){#splash .ball svg,#splash .ball .hop,#splash .fill{animation:none}}
    </style>
  </head>

    <script>
      (function () {
        var tips = [
          "Long-press any chat message to react, reply or copy it.",
          "Game Stats: tap a player, then what they did. Two taps.",
          "Log your wellness every morning — your coach sees how the team feels.",
          "Hydrate early. Thirsty means you're already behind.",
          "Set your face photo in Settings so teammates know who's who.",
          "Turn on notifications so you never miss a schedule change.",
          "Check your Game report on Home after every match.",
          "Sleep is training too. Aim for 8–10 hours.",
          "First touch away from pressure. Head up before the ball arrives.",
          "Talk on the field. 'Man on', 'Time', 'Turn' win games."
        ];
        var i = Math.floor(Math.random() * tips.length);
        var tipEl = document.getElementById("splash-tip");
        function showTip() { tipEl.style.opacity = 0; setTimeout(function () { tipEl.innerHTML = "<b>TIP</b>" + tips[i % tips.length]; tipEl.style.opacity = .85; i++; }, 250); }
        showTip();
        var tipTimer = setInterval(showTip, 3800);
        // Progress eases toward 90% while loading; jumps to 100% when ready.
        // The ball rolls along the front edge of the fill; % counts up.
        var fill = document.getElementById("splash-fill"), ball = document.getElementById("splash-ball"), pct = document.getElementById("splash-pct"), p = 6;
        function setP(v) { p = v; fill.style.width = v + "%"; ball.style.left = v + "%"; pct.textContent = Math.round(v) + "%"; }
        setP(6);
        var barTimer = setInterval(function () { setP(p + (90 - p) * 0.08); }, 250);
        var slowTimer = setTimeout(function () { var s = document.getElementById("splash-slow"); if (s) s.style.display = "block"; }, 20000);
        window.__hideSplash = function () {
          var el = document.getElementById("splash");
          if (!el || el.classList.contains("out")) return;
          clearInterval(barTimer); clearTimeout(slowTimer); setP(100);
          // Stay up at least ~0.8s from page start so a fast open is a smooth
          // fade, not a flash.
          var wait = Math.max(220, 800 - (window.performance ? performance.now() : 0));
          setTimeout(function () {
            el.classList.add("out");
            document.documentElement.style.background = "";
            setTimeout(function () { clearInterval(tipTimer); el.remove(); }, 500);
          }, wait);
        };
      })();
    </script>
